<!doctype html>
<html
	lang="en"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="initial-scale=1, width=device-width" />

		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
			rel="stylesheet"
			integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
			crossorigin="anonymous"
		/>
		<script
			src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
			integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
			crossorigin="anonymous"
		></script>

		<link rel="stylesheet" th:href="@{/styles.css}" />
		<link rel="icon" th:href="@{/favicon.ico}" />

		<title layout:title-pattern="C$50 Finance: $CONTENT_TITLE">C$50 Finance</title>
	</head>

	<body>
		<nav class="bg-light border navbar navbar-expand-md navbar-light">
			<div class="container-fluid">
				<a class="navbar-brand" th:href="@{/}">
					<span class="blue">C</span>
					<span class="red">$</span>
					<span class="yellow">5</span>
					<span class="green">0</span>
					<span class="red">Finance</span>
				</a>
				<button
					aria-controls="navbar"
					aria-expanded="false"
					aria-label="Toggle navigation"
					class="navbar-toggler"
					data-bs-target="#navbar"
					data-bs-toggle="collapse"
					type="button"
				>
					<span class="navbar-toggler-icon"></span>
				</button>
				<div class="collapse navbar-collapse" id="navbar">
					<ul class="navbar-nav me-auto mt-2">
						<li class="nav-item"><a class="nav-link" th:href="@{/}">Search</a></li>
						<th:block th:if="${session.USER_SESSION != null}">
							<li class="nav-item">
								<a class="nav-link" th:href="@{/}">Holdings</a>
							</li>
							<li class="nav-item">
								<a class="nav-link" th:href="@{/transactions}">Transactions</a>
							</li>
						</th:block>
					</ul>

					<ul class="navbar-nav ms-auto mt-2">
						<th:block th:unless="${session.USER_SESSION != null}">
							<li class="nav-item">
								<a class="nav-link" th:href="@{/register}">Register</a>
							</li>
							<li class="nav-item">
								<a class="nav-link" th:href="@{/login}">Log In</a>
							</li>
						</th:block>
						<th:block th:if="${session.USER_SESSION != null}">
							<li class="nav-item">
								<a class="nav-link logout-button" href="#">Log Out</a>
							</li>
						</th:block>
					</ul>
				</div>
			</div>
		</nav>

		<main class="container py-5 text-center">
			<th:block layout:fragment="content" />
		</main>

		<footer class="mb-5">
			<form
				action="https://validator.w3.org/check"
				class="text-center"
				enctype="multipart/form-data"
				method="post"
				target="_blank"
			>
				<input name="doctype" type="hidden" value="HTML5" />
				<input name="fragment" type="hidden" />
			</form>
		</footer>

		<dialog class="error-modal">
			<ul class="error-list"></ul>
			<button class="close-modal">Close</button>
		</dialog>

		<div layout:fragment="scripts">
			<script th:src="@{/js/auth.js}"></script>
			<script th:src="@{/js/layout.js}"></script>
		</div>
	</body>
</html>
