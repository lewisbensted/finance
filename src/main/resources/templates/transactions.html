<!doctype html>
<html
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout}"
>
	<head>
		<title>Transactions</title>
	</head>

	<body>
		<main layout:fragment="content">
			<h1>Transactions</h1>

			<th:block th:if="${transactions.hasContent()}">
				<div class="table-container">
					<table>
						<thead>
							<tr>
								<th>Company Name</th>
								<th>Symbol</th>
								<th>Shares</th>
								<th>Value</th>
								<th>Type</th>
							</tr>
						</thead>

						<tbody>
							<tr
								class="transaction"
								th:each="transaction : ${transactions.content}"
							>
								<td th:text="${transaction.companyName}"></td>

								<td class="symbol" th:text="${transaction.symbol}"></td>

								<td class="current-shares" th:text="${transaction.shares}"></td>

								<td class="value" th:text="${transaction.shares * transaction.price}"></td>
									
								</td><td class="type" th:text="${transaction.transactionType}"></td>
									
								</td>
							</tr>
						</tbody>
					</table>
				</div>

				<div class="message-container">
					<span class="message"></span>
					<button class="btn btn-outline-primary btn-sm open-modal">Info</button>
				</div>
			</th:block>

			<span th:unless="${transactions.hasContent()}"> No transactions to display! </span>
		</main>
	</body>
</html>
